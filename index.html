<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentalCare Pro | Login</title>
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Google Font - Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Animate.css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(45deg, #0b0c10, #1a1e2b);
        overflow: hidden;
        position: relative;
      }

      /* Animated Background Teeth Icons */
      .floating-teeth {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .floating-teeth i {
        position: absolute;
        color: rgba(255, 255, 255, 0.03);
        font-size: 60px;
        animation: float 6s infinite ease-in-out;
      }

      .floating-teeth i:nth-child(1) {
        top: 10%;
        left: 5%;
        animation-delay: 0s;
      }
      .floating-teeth i:nth-child(2) {
        top: 70%;
        left: 85%;
        animation-delay: 1s;
      }
      .floating-teeth i:nth-child(3) {
        top: 40%;
        left: 20%;
        animation-delay: 2s;
      }
      .floating-teeth i:nth-child(4) {
        top: 80%;
        left: 30%;
        animation-delay: 3s;
      }
      .floating-teeth i:nth-child(5) {
        top: 20%;
        left: 70%;
        animation-delay: 4s;
      }
      .floating-teeth i:nth-child(6) {
        top: 60%;
        left: 50%;
        animation-delay: 5s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-30px) rotate(10deg);
        }
      }

      /* Main Container */
      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 1;
        padding: 20px;
      }

      /* Glass Card */
      .login-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 1100px;
        overflow: hidden;
        animation: slideUp 1s ease-out;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .login-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 35px 60px rgba(0, 0, 0, 0.4);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Left Side - Animated */
      .brand-side {
        background: linear-gradient(135deg, #00c6fb 0%, #005bea 100%);
        padding: 60px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        position: relative;
        overflow: hidden;
        min-height: 500px;
      }

      .brand-side::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 70%
        );
        animation: rotate 20s linear infinite;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .brand-content {
        position: relative;
        z-index: 2;
        animation: fadeInLeft 1.2s ease-out;
      }

      .brand-icon {
        width: 120px;
        height: 120px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
        animation: pulse 2s infinite;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }

      .brand-icon i {
        font-size: 60px;
        color: white;
        animation: spin 10s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
        }
        70% {
          box-shadow: 0 0 0 20px rgba(255, 255, 255, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
        }
      }

      .brand-side h2 {
        color: white;
        font-weight: 700;
        font-size: 32px;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        animation: fadeInUp 1s ease-out 0.3s both;
      }

      .brand-side p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 16px;
        line-height: 1.8;
        margin-bottom: 30px;
        animation: fadeInUp 1s ease-out 0.5s both;
      }

      .feature-list {
        text-align: left;
        margin-top: 30px;
        animation: fadeInUp 1s ease-out 0.7s both;
      }

      .feature-item {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
        color: white;
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease;
        cursor: default;
      }

      .feature-item:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateX(10px);
      }

      .feature-item i {
        font-size: 20px;
        width: 30px;
        text-align: center;
      }

      /* Right Side - Login Form */
      .login-side {
        padding: 60px 50px;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(10px);
      }

      .login-header {
        margin-bottom: 40px;
        animation: fadeInRight 1s ease-out;
      }

      .login-header h3 {
        color: white;
        font-weight: 600;
        font-size: 28px;
        margin-bottom: 10px;
      }

      .login-header p {
        color: rgba(255, 255, 255, 0.6);
        font-size: 15px;
      }

      .login-header p a {
        color: #00c6fb;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        position: relative;
      }

      .login-header p a::after {
        content: "";
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -2px;
        left: 0;
        background: linear-gradient(90deg, #00c6fb, #005bea);
        transition: width 0.3s ease;
      }

      .login-header p a:hover::after {
        width: 100%;
      }

      /* Form Styles */
      .form-group {
        margin-bottom: 25px;
        animation: fadeInRight 1s ease-out;
        animation-fill-mode: both;
      }

      .form-group:nth-child(1) {
        animation-delay: 0.2s;
      }
      .form-group:nth-child(2) {
        animation-delay: 0.4s;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.5);
        font-size: 18px;
        transition: all 0.3s ease;
        z-index: 2;
      }

      .input-wrapper .toggle-password {
        left: auto;
        right: 20px;
        cursor: pointer;
      }

      .input-wrapper input {
        width: 100%;
        padding: 18px 50px;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        color: white;
        font-size: 15px;
        transition: all 0.3s ease;
        position: relative;
        z-index: 1;
      }

      .input-wrapper input:focus {
        outline: none;
        border-color: #00c6fb;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 20px rgba(0, 198, 255, 0.3);
      }

      .input-wrapper input:focus + i {
        color: #00c6fb;
      }

      .input-wrapper input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      /* Floating Label Animation */
      .input-wrapper input:not(:placeholder-shown) + i {
        color: #00c6fb;
      }

      /* Options Row */
      .options-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        animation: fadeInRight 1s ease-out 0.6s both;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        user-select: none;
      }

      .remember-me input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #00c6fb;
      }

      .forgot-link {
        color: #00c6fb;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
        position: relative;
      }

      .forgot-link::after {
        content: "";
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -2px;
        left: 0;
        background: linear-gradient(90deg, #00c6fb, #005bea);
        transition: width 0.3s ease;
      }

      .forgot-link:hover::after {
        width: 100%;
      }

      /* Login Button */
      .login-btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(45deg, #00c6fb, #005bea);
        border: none;
        border-radius: 15px;
        color: white;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        animation: fadeInRight 1s ease-out 0.8s both;
      }

      .login-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s ease;
      }

      .login-btn:hover::before {
        left: 100%;
      }

      .login-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0, 198, 255, 0.4);
      }

      .login-btn:active {
        transform: translateY(0);
      }

      /* Social Login */
      .social-login {
        text-align: center;
        margin-top: 30px;
        animation: fadeInUp 1s ease-out 1s both;
      }

      .social-login p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
        margin-bottom: 20px;
        position: relative;
      }

      .social-login p::before,
      .social-login p::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 30%;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }

      .social-login p::before {
        left: 0;
      }
      .social-login p::after {
        right: 0;
      }

      .social-icons {
        display: flex;
        justify-content: center;
        gap: 15px;
      }

      .social-icon {
        width: 45px;
        height: 45px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-decoration: none;
        transition: all 0.3s ease;
        font-size: 20px;
      }

      .social-icon:hover {
        background: linear-gradient(45deg, #00c6fb, #005bea);
        transform: translateY(-5px);
        box-shadow: 0 5px 20px rgba(0, 198, 255, 0.3);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .brand-side {
          display: none;
        }

        .login-side {
          padding: 40px 30px;
        }

        .login-card {
          margin: 20px;
        }
      }

      /* Loading Animation */
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: all 0.5s ease;
      }

      .loading.active {
        opacity: 1;
        pointer-events: all;
      }

      .tooth-loader {
        width: 80px;
        height: 80px;
        background: linear-gradient(45deg, #00c6fb, #005bea);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: loaderPulse 1.5s ease infinite;
      }

      .tooth-loader i {
        font-size: 40px;
        color: white;
        animation: loaderSpin 2s linear infinite;
      }

      @keyframes loaderPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      @keyframes loaderSpin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Animated Background Teeth -->
    <div class="floating-teeth">
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
    </div>

    <!-- Loading Animation -->
    <div class="loading" id="loading">
      <div class="tooth-loader">
        <i class="fas fa-tooth"></i>
      </div>
    </div>

    <!-- Main Container -->
    <div class="container">
      <div class="login-card">
        <div class="row g-0">
          <!-- Left Side - Brand with Animation -->
          <div class="col-lg-6 brand-side">
            <div class="brand-content">
              <div class="brand-icon">
                <i class="fas fa-tooth"></i>
              </div>
              <h2 class="animate__animated animate__fadeInUp">
                DentalCare Pro
              </h2>
              <p class="animate__animated animate__fadeInUp animate__delay-1s">
                Complete Dental Management Solution for Modern Clinics
              </p>

              <div class="feature-list">
                <div
                  class="feature-item animate__animated animate__fadeInLeft animate__delay-2s"
                >
                  <i class="fas fa-calendar-check"></i>
                  <span>Smart Appointment Scheduling</span>
                </div>
                <div
                  class="feature-item animate__animated animate__fadeInLeft animate__delay-3s"
                >
                  <i class="fas fa-notes-medical"></i>
                  <span>Digital Patient Records</span>
                </div>
                <div
                  class="feature-item animate__animated animate__fadeInLeft animate__delay-4s"
                >
                  <i class="fas fa-chart-line"></i>
                  <span>Advanced Analytics & Reports</span>
                </div>
                <div
                  class="feature-item animate__animated animate__fadeInLeft animate__delay-5s"
                >
                  <i class="fas fa-shield-alt"></i>
                  <span>HIPAA Compliant Security</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Right Side - Login Form -->
          <div class="col-lg-6 login-side">
            <div class="login-header">
              <h3>Welcome Back!</h3>
              <p>Don't have an account? <a href="#">Contact Admin</a></p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
              <!-- Username Field -->
              <div class="form-group">
                <div class="input-wrapper">
                  <i class="fas fa-user"></i>
                  <input
                    type="text"
                    placeholder="Username or Email"
                    id="username"
                    required
                  />
                </div>
              </div>

              <!-- Password Field -->
              <div class="form-group">
                <div class="input-wrapper">
                  <i class="fas fa-lock"></i>
                  <i
                    class="fas fa-eye toggle-password"
                    onclick="togglePassword()"
                  ></i>
                  <input
                    type="password"
                    placeholder="Password"
                    id="password"
                    required
                  />
                </div>
              </div>

              <!-- Options Row -->
              <div class="options-row">
                <label class="remember-me">
                  <input type="checkbox" checked />
                  <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
              </div>

              <!-- Login Button -->
              <button type="submit" class="login-btn">
                <span>Login to Dashboard</span>
                <i class="fas fa-arrow-right ms-2"></i>
              </button>

              <!-- Social Login -->
              <div class="social-login">
                <p>Or login with</p>
                <div class="social-icons">
                  <a href="#" class="social-icon">
                    <i class="fab fa-google"></i>
                  </a>
                  <a href="#" class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                  </a>
                  <a href="#" class="social-icon">
                    <i class="fab fa-microsoft"></i>
                  </a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Password Toggle
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.querySelector(".toggle-password");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.classList.remove("fa-eye");
          toggleIcon.classList.add("fa-eye-slash");
        } else {
          passwordInput.type = "password";
          toggleIcon.classList.remove("fa-eye-slash");
          toggleIcon.classList.add("fa-eye");
        }
      }

      // Form Submit with Loading Animation
      function handleLogin(event) {
        event.preventDefault();

        // Show Loading
        const loading = document.getElementById("loading");
        loading.classList.add("active");

        // Get form values
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        // Simulate login (replace with actual authentication)
        setTimeout(() => {
          loading.classList.remove("active");

          // Here you can add your authentication logic
          if (username && password) {
            // Successful login - redirect to dashboard
            // window.location.href = 'dashboard.html';
            alert("Login Successful! Redirecting to dashboard...");
          } else {
            alert("Please enter username and password");
          }
        }, 2000);
      }

      // Input Focus Animations
      document.querySelectorAll(".input-wrapper input").forEach((input) => {
        input.addEventListener("focus", function () {
          this.parentElement.querySelector("i:first-child").style.color =
            "#00c6fb";
        });

        input.addEventListener("blur", function () {
          if (!this.value) {
            this.parentElement.querySelector("i:first-child").style.color =
              "rgba(255,255,255,0.5)";
          }
        });
      });

      // Add floating animation to teeth
      document.addEventListener("mousemove", function (e) {
        const teeth = document.querySelectorAll(".floating-teeth i");
        const mouseX = e.clientX / window.innerWidth;
        const mouseY = e.clientY / window.innerHeight;

        teeth.forEach((tooth, index) => {
          const speed = index + 1;
          const x = (window.innerWidth - mouseX * speed) / 100;
          const y = (window.innerHeight - mouseY * speed) / 100;
          tooth.style.transform = `translate(${x}px, ${y}px)`;
        });
      });
    </script>
  </body>
</html>
