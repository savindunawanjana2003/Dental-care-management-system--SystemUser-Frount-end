<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentalCare Pro | Login</title>
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Google Font - Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Animate.css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <!-- Animated Background Teeth -->
    <div class="floating-teeth">
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
    </div>

    <!-- Loading Animation -->
    <div class="loading" id="loading">
      <div class="tooth-loader">
        <i class="fas fa-tooth"></i>
      </div>
    </div>

    <!-- Main Container -->
    <div class="container">
      <div class="login-card">
        <div class="row g-0">
          <!-- Left Side - Brand with Animation -->
          <div class="col-lg-6 brand-side">
            <div class="brand-content">
              <div class="brand-icon">
                <i class="fas fa-tooth"></i>
              </div>
              <h2 class="animate__animated animate__fadeInUp">
                DentalCare Pro
              </h2>
              <p class="animate__animated animate__fadeInUp animate__delay-1s">
                Complete Dental Management Solution for Modern Clinics
              </p>

              <div class="feature-list">
                <div
                  class="feature-item animate__animated animate__fadeInLeft animate__delay-2s"
                >
                  <i class="fas fa-calendar-check"></i>
                  <span>Smart Appointment Scheduling</span>
                </div>
                <div
                  class="feature-item animate__animated animate__fadeInLeft animate__delay-3s"
                >
                  <i class="fas fa-notes-medical"></i>
                  <span>Digital Patient Records</span>
                </div>
                <div
                  class="feature-item animate__animated animate__fadeInLeft animate__delay-4s"
                >
                  <i class="fas fa-chart-line"></i>
                  <span>Advanced Analytics & Reports</span>
                </div>
                <div
                  class="feature-item animate__animated animate__fadeInLeft animate__delay-5s"
                >
                  <i class="fas fa-shield-alt"></i>
                  <span>HIPAA Compliant Security</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Right Side - Login Form -->
          <div class="col-lg-6 login-side">
            <div class="login-header">
              <h3>Welcome Back!</h3>
              <p>Don't have an account? <a href="#">Contact Admin</a></p>
            </div>

            <div id="loginForm" onsubmit="handleLogin(event)">
              <!-- Username Field -->
              <div class="form-group">
                <div class="input-wrapper">
                  <i class="fas fa-user"></i>
                  <input
                    type="text"
                    placeholder="User name"
                    id="username"
                    required
                  />
                </div>
              </div>

              <!-- Password Field -->
              <div class="form-group">
                <div class="input-wrapper">
                  <i class="fas fa-lock"></i>
                  <i
                    class="fas fa-eye toggle-password"
                    onclick="togglePassword()"
                  ></i>
                  <input
                    type="password"
                    placeholder="Password"
                    id="password"
                    required
                  />
                </div>
              </div>

              <!-- Options Row -->
              <div class="options-row">
                <label class="remember-me">
                  <input type="checkbox" checked />
                  <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
              </div>

              <!-- Login Button -->
              <button type="button" class="login-btn" id="loginButten">
                <span>Login to Dashboard</span>
                <i class="fas fa-arrow-right ms-2"></i>
              </button>

              <!-- Social Login -->
              <div class="social-login">
                <p>Or login with</p>
                <div class="social-icons">
                  <a href="#" class="social-icon">
                    <i class="fab fa-google"></i>
                  </a>
                  <a href="#" class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                  </a>
                  <a href="#" class="social-icon">
                    <i class="fab fa-microsoft"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
