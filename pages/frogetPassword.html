<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>DentalCare Pro | Set New Password</title>
    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Google Font - Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Animate.css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(45deg, #0b0c10, #1a1e2b);
        overflow-x: hidden;
        overflow-y: auto;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      /* Animated Background Teeth Icons - reduced count & subtle */
      .floating-teeth {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.5;
      }

      .floating-teeth i {
        position: absolute;
        color: rgba(255, 255, 255, 0.04);
        font-size: 50px;
        animation: float 8s infinite ease-in-out;
      }

      .floating-teeth i:nth-child(1) {
        top: 8%;
        left: 5%;
        animation-delay: 0s;
      }
      .floating-teeth i:nth-child(2) {
        top: 75%;
        left: 88%;
        animation-delay: 1.5s;
        font-size: 45px;
      }
      .floating-teeth i:nth-child(3) {
        top: 45%;
        left: 15%;
        animation-delay: 2.5s;
        font-size: 55px;
      }
      .floating-teeth i:nth-child(4) {
        top: 85%;
        left: 25%;
        animation-delay: 3.8s;
      }
      .floating-teeth i:nth-child(5) {
        top: 18%;
        left: 82%;
        animation-delay: 4.5s;
        font-size: 40px;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-25px) rotate(6deg);
        }
      }

      /* Main Container - slightly reduced max-width for better compactness */
      .container {
        width: 100%;
        max-width: 520px;
        position: relative;
        z-index: 1;
      }

      /* Glass Card - reduced internal padding to lower overall height */
      .password-card {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        animation: slideUp 0.7s ease-out;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .password-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 28px 50px rgba(0, 0, 0, 0.35);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(35px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* HEADER - compact height */
      .header {
        background: linear-gradient(135deg, #00c6fb 0%, #005bea 100%);
        padding: 26px 24px 22px 24px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .header::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.12) 0%,
          transparent 70%
        );
        animation: rotate 22s linear infinite;
        top: -50%;
        left: -50%;
        pointer-events: none;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .header-content {
        position: relative;
        z-index: 2;
      }

      .header-icon {
        width: 64px;
        height: 64px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px;
        font-size: 32px;
        color: white;
        animation: softPulse 2s infinite;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }

      @keyframes softPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3);
        }
        70% {
          box-shadow: 0 0 0 12px rgba(255, 255, 255, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
        }
      }

      .header h1 {
        color: white;
        font-weight: 700;
        font-size: 26px;
        margin-bottom: 5px;
        letter-spacing: -0.2px;
      }

      .header p {
        color: rgba(255, 255, 255, 0.92);
        font-size: 14px;
      }

      /* FORM CONTAINER - reduced vertical padding */
      .form-container {
        padding: 26px 28px 28px 28px;
      }

      /* Strength Meter - compact but clear */
      .strength-container {
        margin-bottom: 20px;
      }

      .strength-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }

      .strength-header h3 {
        font-size: 14px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.85);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .strength-header h3 i {
        font-size: 13px;
      }

      .strength-value {
        font-size: 12px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.12);
      }

      .strength-meter {
        height: 6px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 6px;
      }

      .strength-fill {
        height: 100%;
        width: 10%;
        border-radius: 4px;
        background-color: #e11d48;
        transition:
          width 0.25s ease,
          background-color 0.2s;
      }

      .strength-labels {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.5);
      }

      .strength-labels span {
        width: 20%;
        text-align: center;
      }

      /* Form Group - tighter margins */
      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
        font-size: 13px;
      }

      .password-input-container {
        position: relative;
      }

      .password-input {
        width: 100%;
        padding: 12px 48px;
        background: rgba(255, 255, 255, 0.06);
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        font-size: 14px;
        color: white;
        transition: all 0.25s ease;
      }

      .password-input:focus {
        outline: none;
        border-color: #00c6fb;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 12px rgba(0, 198, 255, 0.2);
      }

      .password-input::placeholder {
        color: rgba(255, 255, 255, 0.4);
        font-size: 13px;
      }

      .input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.5);
        font-size: 16px;
      }

      .password-toggle {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        font-size: 16px;
        transition: color 0.2s;
      }

      .password-toggle:hover {
        color: #00c6fb;
      }

      /* match message */
      #passwordMatch {
        margin-top: 6px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* REQUIREMENTS - more compact, less padding */
      .requirements {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        padding: 16px 18px;
        margin: 20px 0 18px 0;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .requirements h4 {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .requirements h4 i {
        color: #00c6fb;
        font-size: 13px;
      }

      .requirement-list {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
      }

      .requirement-list li {
        display: inline-flex;
        align-items: center;
        color: rgba(255, 255, 255, 0.65);
        font-size: 12px;
        transition: all 0.2s;
        gap: 6px;
      }

      .requirement-list li i {
        font-size: 10px;
        width: 14px;
        color: rgba(255, 255, 255, 0.4);
      }

      .requirement-list li.valid {
        color: #10b981;
      }

      .requirement-list li.valid i {
        color: #10b981;
      }

      /* BUTTONS - reduced height, comfortable */
      .form-actions {
        display: flex;
        gap: 14px;
        margin-top: 20px;
      }

      .btn {
        flex: 1;
        padding: 12px 14px;
        border: none;
        border-radius: 40px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn i {
        font-size: 14px;
      }

      .btn-primary {
        background: linear-gradient(95deg, #00c6fb, #005bea);
        color: white;
        box-shadow: 0 5px 12px rgba(0, 91, 234, 0.25);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(0, 198, 255, 0.35);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.07);
        color: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.13);
        transform: translateY(-2px);
      }

      /* Status Message */
      .status-message {
        padding: 10px 16px;
        border-radius: 40px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        display: none;
        animation: fadeSlide 0.25s ease;
      }

      @keyframes fadeSlide {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-success {
        background: rgba(16, 185, 129, 0.12);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.25);
      }

      .message-error {
        background: rgba(239, 68, 68, 0.12);
        color: #ff7b7b;
        border: 1px solid rgba(239, 68, 68, 0.25);
      }

      /* FOOTER compact */
      .footer {
        text-align: center;
        padding: 14px 20px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        background: rgba(0, 0, 0, 0.2);
      }

      /* Loading Overlay */
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }

      .loading.active {
        opacity: 1;
        pointer-events: all;
      }

      .tooth-loader {
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, #00c6fb, #005bea);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulseScale 1.2s ease infinite;
      }

      .tooth-loader i {
        font-size: 36px;
        color: white;
        animation: spinSlow 1.8s linear infinite;
      }

      @keyframes pulseScale {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes spinSlow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* responsive adjustments */
      @media (max-width: 500px) {
        .form-container {
          padding: 20px 20px 24px;
        }
        .header {
          padding: 20px 20px 16px;
        }
        .requirement-list {
          gap: 6px 12px;
        }
        .requirements {
          padding: 12px 14px;
        }
        .btn {
          padding: 10px 12px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="floating-teeth">
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
      <i class="fas fa-tooth"></i>
    </div>

    <div class="loading" id="loading">
      <div class="tooth-loader">
        <i class="fas fa-tooth"></i>
      </div>
    </div>

    <div class="container">
      <div class="password-card">
        <div class="header">
          <div class="header-content">
            <div class="header-icon">
              <i class="fas fa-key"></i>
            </div>
            <h1 class="animate__animated animate__fadeInUp">
              Set New Password
            </h1>
            <p class="animate__animated animate__fadeInUp animate__delay-1s">
              Create a strong & unique password
            </p>
          </div>
        </div>

        <div class="form-container">
          <div id="statusMessage" class="status-message">
            <i class="fas fa-info-circle"></i>
            <span id="statusText"></span>
          </div>

          <div class="strength-container">
            <div class="strength-header">
              <h3><i class="fas fa-shield-alt"></i> Password Strength</h3>
              <div class="strength-value" id="strengthValue">Very Weak</div>
            </div>
            <div class="strength-meter">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-labels">
              <span>Very Weak</span><span>Weak</span><span>Fair</span
              ><span>Good</span><span>Strong</span>
            </div>
          </div>

          <form id="passwordForm">
            <div class="form-group">
              <label
                ><i
                  class="fas fa-lock"
                  style="margin-right: 6px; color: #00c6fb"
                ></i>
                New Password</label
              >
              <div class="password-input-container">
                <i class="fas fa-key input-icon"></i>
                <input
                  type="password"
                  id="newPassword"
                  class="password-input"
                  placeholder="Enter new password"
                  autocomplete="new-password"
                />
                <span class="password-toggle" id="toggleNewPassword"
                  ><i class="fas fa-eye"></i
                ></span>
              </div>
            </div>

            <div class="form-group">
              <label
                ><i
                  class="fas fa-check-circle"
                  style="margin-right: 6px; color: #00c6fb"
                ></i>
                Confirm Password</label
              >
              <div class="password-input-container">
                <i class="fas fa-key input-icon"></i>
                <input
                  type="password"
                  id="confirmPassword"
                  class="password-input"
                  placeholder="Confirm new password"
                  autocomplete="new-password"
                />
                <span class="password-toggle" id="toggleConfirmPassword"
                  ><i class="fas fa-eye"></i
                ></span>
              </div>
              <div id="passwordMatch"></div>
            </div>

            <div class="requirements">
              <h4><i class="fas fa-list-check"></i> Password Requirements</h4>
              <ul class="requirement-list" id="requirementList">
                <li id="reqLength">
                  <i class="fas fa-circle"></i> At least 8 characters
                </li>
                <li id="reqUppercase">
                  <i class="fas fa-circle"></i> 1 uppercase (A-Z)
                </li>
                <li id="reqLowercase">
                  <i class="fas fa-circle"></i> 1 lowercase (a-z)
                </li>
                <li id="reqNumber">
                  <i class="fas fa-circle"></i> 1 number (0-9)
                </li>
                <li id="reqSpecial">
                  <i class="fas fa-circle"></i> 1 special (!@#$%^&*)
                </li>
              </ul>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary" id="cancelBtn">
                <i class="fas fa-times"></i> Cancel
              </button>
              <button type="button" class="btn btn-primary" id="submitBtn">
                <i class="fas fa-check-circle"></i> Set Password
              </button>
            </div>
          </form>
        </div>

        <div class="footer">
          <p>🔒 Use a strong password & keep it private.</p>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script>
      $(document).ready(function () {
        // DOM elements
        const $newPass = $("#newPassword");
        const $confirmPass = $("#confirmPassword");
        const $strengthFill = $("#strengthFill");
        const $strengthValue = $("#strengthValue");
        const $submitBtn = $("#submitBtn");
        const $cancelBtn = $("#cancelBtn");
        const $loading = $("#loading");
        const $statusMsg = $("#statusMessage");
        const $statusText = $("#statusText");

        // Requirements mapping
        const requirements = {
          length: {
            element: $("#reqLength"),
            condition: (pwd) => pwd.length >= 8,
          },
          uppercase: {
            element: $("#reqUppercase"),
            condition: (pwd) => /[A-Z]/.test(pwd),
          },
          lowercase: {
            element: $("#reqLowercase"),
            condition: (pwd) => /[a-z]/.test(pwd),
          },
          number: {
            element: $("#reqNumber"),
            condition: (pwd) => /[0-9]/.test(pwd),
          },
          special: {
            element: $("#reqSpecial"),
            condition: (pwd) => /[!@#$%^&*]/.test(pwd),
          },
        };

        function updateRequirements(pwd) {
          let validCount = 0;
          for (let key in requirements) {
            const isValid = requirements[key].condition(pwd);
            if (isValid) {
              requirements[key].element.addClass("valid");
              validCount++;
            } else {
              requirements[key].element.removeClass("valid");
            }
          }
          return validCount;
        }

        function getStrengthLevel(validCount, pwdLen) {
          if (pwdLen === 0)
            return { text: "Very Weak", width: "10%", color: "#e11d48" };
          if (validCount <= 1)
            return { text: "Very Weak", width: "20%", color: "#e11d48" };
          if (validCount === 2)
            return { text: "Weak", width: "35%", color: "#f59e0b" };
          if (validCount === 3)
            return { text: "Fair", width: "55%", color: "#fbbf24" };
          if (validCount === 4)
            return { text: "Good", width: "75%", color: "#10b981" };
          return { text: "Strong", width: "95%", color: "#10b981" };
        }

        function updateStrengthMeter() {
          const pwd = $newPass.val();
          const validCount = updateRequirements(pwd);
          const level = getStrengthLevel(validCount, pwd.length);
          $strengthValue.text(level.text);
          $strengthFill.css({
            width: level.width,
            backgroundColor: level.color,
          });
        }

        function checkPasswordMatch() {
          const newPwd = $newPass.val();
          const confirmPwd = $confirmPass.val();
          const $matchDiv = $("#passwordMatch");
          if (confirmPwd === "") {
            $matchDiv.html("");
            return false;
          }
          if (newPwd === confirmPwd) {
            $matchDiv.html(
              '<i class="fas fa-check-circle" style="color:#10b981"></i> <span style="color:#10b981">Passwords match</span>',
            );
            return true;
          } else {
            $matchDiv.html(
              '<i class="fas fa-times-circle" style="color:#ef4444"></i> <span style="color:#ef4444">Passwords do not match</span>',
            );
            return false;
          }
        }

        function isPasswordValid() {
          const pwd = $newPass.val();
          const lengthOk = pwd.length >= 8;
          const upperOk = /[A-Z]/.test(pwd);
          const lowerOk = /[a-z]/.test(pwd);
          const numberOk = /[0-9]/.test(pwd);
          const specialOk = /[!@#$%^&*]/.test(pwd);
          return lengthOk && upperOk && lowerOk && numberOk && specialOk;
        }

        function validateForm() {
          const pwdValid = isPasswordValid();
          const matchOk = checkPasswordMatch();
          return pwdValid && matchOk && $newPass.val().length > 0;
        }

        function showMessage(text, isError) {
          $statusMsg.removeClass("message-success message-error");
          $statusMsg.addClass(isError ? "message-error" : "message-success");
          $statusText.text(text);
          $statusMsg.fadeIn(180);
          setTimeout(() => {
            $statusMsg.fadeOut(300);
          }, 3600);
        }

        // Event listeners
        $newPass.on("input", function () {
          updateStrengthMeter();
          checkPasswordMatch();
        });

        $confirmPass.on("input", function () {
          checkPasswordMatch();
        });

        // toggle visibility
        $("#toggleNewPassword").on("click", function () {
          const type =
            $newPass.attr("type") === "password" ? "text" : "password";
          $newPass.attr("type", type);
          $(this).find("i").toggleClass("fa-eye fa-eye-slash");
        });
        $("#toggleConfirmPassword").on("click", function () {
          const type =
            $confirmPass.attr("type") === "password" ? "text" : "password";
          $confirmPass.attr("type", type);
          $(this).find("i").toggleClass("fa-eye fa-eye-slash");
        });

        // Cancel button: redirect or clear
        $cancelBtn.on("click", function () {
          Swal.fire({
            title: "Cancel?",
            text: "Are you sure you want to cancel? Your password won't be changed.",
            icon: "question",
            background: "#1e1a2f",
            color: "#fff",
            confirmButtonColor: "#ef4444",
            cancelButtonColor: "#6c757d",
            showCancelButton: true,
            confirmButtonText: "Yes, cancel",
          }).then((result) => {
            if (result.isConfirmed) {
              window.location.href = "../login.html"; // fallback to login
            }
          });
        });

        // Submit: simulate password reset with SweetAlert & loading
        $submitBtn.on("click", function () {
          if (!validateForm()) {
            let errorMsg = "";
            if (!isPasswordValid())
              errorMsg = "Password does not meet all requirements.";
            else if (!checkPasswordMatch())
              errorMsg = "Passwords do not match.";
            else errorMsg = "Please fill all fields correctly.";
            showMessage(errorMsg, true);
            return;
          }

          $loading.addClass("active");
          // Simulate API call
          setTimeout(() => {
            $loading.removeClass("active");
            Swal.fire({
              icon: "success",
              title: "Password Updated!",
              text: "Your password has been successfully reset. You can now log in.",
              background: "#1f1a2e",
              color: "#ffffff",
              confirmButtonColor: "#00c6fb",
              confirmButtonText: "Go to Login",
            }).then(() => {
              // redirect to login page after success
              window.location.href = "../login.html";
            });
          }, 1000);
        });

        // initial updates
        updateStrengthMeter();
        checkPasswordMatch();
      });
    </script>
  </body>
</html>
